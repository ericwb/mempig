name: Release

on:
  release:
    types: [published]
  # Manual runs build and package everything but don't upload: a dry run.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        # x86_64 macOS binaries run on Apple Silicon runners via Rosetta.
        run: ./target/${{ matrix.target }}/release/mempig -n 3 -g

      - name: Package
        id: package
        shell: bash
        run: |
          name="mempig-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/mempig" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "files=dist/$name.tar.gz dist/$name.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ${{ steps.package.outputs.files }} --clobber

      - name: Keep as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: mempig-${{ matrix.target }}
          path: dist/*.tar.gz*

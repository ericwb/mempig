name: Release

on:
  release:
    types: [published]
  # Manual runs: with a tag, rebuild that tag and upload to its existing
  # release; without one, build and package main as a dry run (no upload).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild and upload to (e.g. v0.0.1). Leave empty for a dry run."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG || github.ref }}

      - name: Set version from tag
        if: env.TAG != ''
        shell: bash
        run: |
          VER="${TAG#v}"
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a semver version like v1.2.3"
            exit 1
          fi
          export VER
          # Only the first `version =` in Cargo.toml is the package's own.
          perl -pi -e 'if (!$done && s/^version = ".*"/version = "$ENV{VER}"/) { $done = 1 }' Cargo.toml
          perl -0pi -e 's/(name = "mempig"\nversion = )"[^"]*"/$1"$ENV{VER}"/' Cargo.lock
          grep -m1 '^version' Cargo.toml
          echo "VER=$VER" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        # x86_64 macOS binaries run on Apple Silicon runners via Rosetta.
        shell: bash
        run: |
          bin=./target/${{ matrix.target }}/release/mempig
          $bin -n 3 -g
          $bin --version
          if [ -n "${VER:-}" ] && [ "$($bin --version)" != "mempig $VER" ]; then
            echo "::error::Expected 'mempig $VER' from --version"
            exit 1
          fi

      - name: Package
        id: package
        shell: bash
        run: |
          name="mempig-${TAG:-$(git rev-parse --short HEAD)}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/mempig" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "files=dist/$name.tar.gz dist/$name.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Upload to release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ${{ steps.package.outputs.files }} --clobber

      - name: Keep as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: mempig-${{ matrix.target }}
          path: dist/*.tar.gz*

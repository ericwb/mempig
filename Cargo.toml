[package]
name = "mempig"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Show total and used memory, and the processes hogging it."
license = "GPL-3.0-only"
repository = "https://github.com/ericwb/mempig"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
sysinfo = "0.33"

[profile.release]
lto = true
codegen-units = 1
strip = true
